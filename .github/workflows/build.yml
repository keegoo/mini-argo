name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: fmt / check / test / clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo check
        run: cargo check --locked

      - name: cargo test
        run: cargo test --locked

      - name: cargo clippy
        run: cargo clippy --locked -- -D warnings

  docker:
    name: build and push image to GHCR
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute immutable image tag
        id: tag
        run: echo "value=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/keegoo/mini-argo:${{ steps.tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-manifest:
    name: pin image tag in config/deployment.yaml
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Pin image tag and commit
        run: |
          sed -i "s|image: ghcr.io/keegoo/mini-argo:.*|image: ghcr.io/keegoo/mini-argo:sha-${GITHUB_SHA:0:7}|" config/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/deployment.yaml
          git diff --cached --quiet || git commit -m "chore: pin controller image to sha-${GITHUB_SHA:0:7}"
          git push
