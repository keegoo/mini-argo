[package]
name = "mini-argocd-controller"
version = "0.1.0"
edition = "2024"

[dependencies]
k8s-openapi = { version = "0.28.0", features = ["latest"] }
kube = { version = "4.2.0", features = ["client", "rustls-tls", "derive"] }
kube-runtime = "4.2.0"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
